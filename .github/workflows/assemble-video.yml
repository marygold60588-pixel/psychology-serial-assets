name: Assemble episode video

on:
  push:
    paths:
      - 'episodes/*/assemble-request.json'

permissions:
  contents: write

concurrency:
  group: assemble-main
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Concatenate scene videos
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x scripts/assemble_episode.sh
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            echo "push event has no before sha" >&2
            exit 1
          fi
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${AFTER}" \
            -o compare.json
          if ! jq -e '.files | type == "array"' compare.json >/dev/null; then
            echo "compare ${BEFORE}...${AFTER} did not return a file list" >&2
            jq -r '.message // "no files"' compare.json >&2
            exit 1
          fi
          mapfile -t FILES < <(jq -r '.files[]? | select(.status == "added" or .status == "modified" or .status == "renamed") | .filename' compare.json | grep -E '^episodes/[0-9a-fA-F-]{36}/assemble-request\.json$' | sort -u || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "no assemble-request.json between ${BEFORE} and ${AFTER}" >&2
            exit 1
          fi
          for FILE in "${FILES[@]}"; do
            EPISODE_ID="$(basename "$(dirname "$FILE")")"
            echo "REQUEST_FILE=${FILE}"
            echo "EPISODE_ID=${EPISODE_ID}"
            echo "REQUEST_FILE=${FILE}" >> "$GITHUB_ENV"
            echo "EPISODE_ID=${EPISODE_ID}" >> "$GITHUB_ENV"
            scripts/assemble_episode.sh "$FILE"
          done

      - name: Commit final video
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          git add episodes/*/final.mp4 episodes/*/assemble-result.json
          if [ -z "$(git status --porcelain --untracked-files=all -- episodes)" ]; then
            echo "assemble produced no files to commit" >&2
            exit 1
          fi
          git commit -m "Assemble episode video"
          git push
